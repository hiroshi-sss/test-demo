<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2Dカラー試作 | WetSuitsDemo</title>
  <style>
    body { margin: 0; background: #151e1b; color: #f0f5f2; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 900px; margin: auto; padding: 24px; }
    h1 { font-size: 26px; margin: 0 0 20px; }
    nav { margin-bottom: 16px; }
    nav a { color: #9ce1cc; }
    .preview { display: grid; grid-template-columns: minmax(0, 1fr) 250px; align-items: start; gap: 24px; }
    .photo { position: relative; }
    img, canvas { display: block; width: 100%; height: auto; border-radius: 12px; }
    canvas { position: absolute; inset: 0; }
    fieldset { border: 1px solid #53645d; border-radius: 12px; padding: 16px; }
    button { display: block; width: 100%; margin-block: 8px; padding: 8px; border: 1px solid #53645d; border-radius: 6px; background: #23342e; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #9ce1cc; outline: 1px solid #9ce1cc; }
    button:disabled { opacity: .55; cursor: default; }
    input[type="file"] { max-width: 100%; }
    .editing canvas { cursor: crosshair; }
    #status:empty { display: none; }
    [hidden] { display: none !important; }
    @media (max-width: 620px) {
      .preview { grid-template-columns: 1fr; }
      fieldset { grid-row: 1; }
      button { display: inline-block; width: auto; margin: 4px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/preview2d-Dbv7HEli.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <main>
    <nav aria-label="オーダーページ"><a href="./order.html">‹ 3Dオーダーに戻る</a></nav>
    <h1>2Dカラープレビュー</h1>
    <div class="preview">
      <div>
        <p id="photo-empty">商品写真を選ぶと、ここで色替え範囲を指定できます。</p>
        <div class="photo" hidden>
          <img alt="読み込んだウェットスーツの商品写真">
          <canvas aria-hidden="true"></canvas>
        </div>
      </div>
      <fieldset disabled>
        <legend>写真と色替え範囲</legend>
        <label>商品写真 <input id="upload" type="file" accept="image/*"></label>
        <button type="button" id="auto-select" aria-pressed="false">似た色の範囲を選ぶ</button>
        <button type="button" id="start">輪郭を手動で囲む</button>
        <div id="edit-tools" hidden>
          <button type="button" id="undo">最後の点を取り消す</button>
          <button type="button" id="finish">範囲を確定</button>
          <button type="button" id="cancel">キャンセル</button>
        </div>
        <p id="status" role="status"></p>
        <hr>
        <button type="button" data-color="" aria-pressed="true">元の色</button>
        <button type="button" data-color="#2b5290" aria-pressed="false">ブルー</button>
        <button type="button" data-color="#32634a" aria-pressed="false">ダークグリーン</button>
        <button type="button" data-color="#dc608e" aria-pressed="false">ピンク</button>
        <button type="button" data-color="#a54444" aria-pressed="false">レッド</button>
        <label>自由に選ぶ <input type="color" value="#32634a"></label>
      </fieldset>
    </div>
  </main>
</body>
</html>
